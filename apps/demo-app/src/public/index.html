<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f8fafc;
      color: #0f172a;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin-top: 0;
      color: #1e293b;
      font-size: 1.5rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      text-align: left;
      padding: 0.75rem;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background: #f1f5f9;
      font-weight: 600;
    }
    button {
      background: #ef4444;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.875rem;
    }
    button:hover {
      background: #dc2626;
    }
    .btn-add {
      background: #2563eb;
    }
    .btn-add:hover {
      background: #1d4ed8;
    }
    .form-group {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.5rem;
    }
    input {
      padding: 0.5rem;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      flex: 1;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      background: #e2e8f0;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📦 Warehouse Inventory</h1>
    <p>Manage in-stock catalog items.</p>

    <table>
      <thead>
        <tr>
          <th>Item Name</th>
          <th>Stock Count</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="items-table-body">
        <!-- Rendered dynamically -->
      </tbody>
    </table>

    <div class="form-group">
      <input type="text" id="item-name" placeholder="Item name (e.g. Widget D)">
      <input type="number" id="item-count" placeholder="Quantity" value="1" style="max-width: 100px;">
      <button class="btn-add" id="btn-add-item" onclick="addItem()">Add Item</button>
    </div>
  </div>

  <script>
    async function loadItems() {
      const res = await fetch('/api/items');
      const items = await res.json();
      const tbody = document.getElementById('items-table-body');
      tbody.innerHTML = '';
      items.forEach(item => {
        const tr = document.createElement('tr');
        tr.setAttribute('data-item-id', item.id);
        tr.innerHTML = `
          <td><span class="item-name">${item.name}</span></td>
          <td><span class="badge">${item.count}</span></td>
          <td>
            <button onclick="deleteItem('${item.id}')">Delete ${item.name}</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deleteItem(id) {
      await fetch('/api/items/' + id, { method: 'DELETE' });
      await loadItems();
    }

    async function addItem() {
      const nameInput = document.getElementById('item-name');
      const countInput = document.getElementById('item-count');
      const name = nameInput.value.trim();
      const count = countInput.value;
      if (!name) return;
      await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, count }),
      });
      nameInput.value = '';
      await loadItems();
    }

    window.addEventListener('DOMContentLoaded', loadItems);
  </script>
</body>
</html>
