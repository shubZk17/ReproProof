<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TodoMVC - Task Manager</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      padding: 2rem;
      margin: 0;
    }
    .todoapp {
      background: #fff;
      max-width: 550px;
      margin: 0 auto;
      box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      overflow: hidden;
    }
    header {
      padding: 1.5rem;
      border-bottom: 1px solid #ededed;
    }
    h1 {
      margin: 0 0 1rem 0;
      color: #b83f45;
      font-size: 2rem;
      text-align: center;
    }
    .new-todo {
      width: 90%;
      padding: 0.8rem;
      border: 1px solid #ccc;
      font-size: 1rem;
      border-radius: 4px;
    }
    .todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .todo-list li {
      display: flex;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid #ededed;
    }
    .todo-list li.completed label {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .todo-list li label {
      flex: 1;
      margin-left: 0.8rem;
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1rem;
      background: #fbfbfb;
      border-top: 1px solid #e6e6e6;
      font-size: 0.875rem;
    }
    .clear-completed {
      background: #64748b;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .clear-completed:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <section class="todoapp">
    <header>
      <h1>todos</h1>
      <input class="new-todo" id="todo-input" placeholder="What needs to be done?" autofocus>
    </header>
    <ul class="todo-list" id="todos-container"></ul>
    <footer>
      <span id="todo-count">0 items left</span>
      <button class="clear-completed" id="btn-clear-completed" onclick="clearCompleted()">Clear completed</button>
    </footer>
  </section>

  <script>
    async function fetchTodos() {
      const res = await fetch('/api/todos');
      const items = await res.json();
      const container = document.getElementById('todos-container');
      container.innerHTML = '';
      let activeCount = 0;
      items.forEach(t => {
        if (!t.completed) activeCount++;
        const li = document.createElement('li');
        if (t.completed) li.classList.add('completed');
        li.innerHTML = `
          <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggle('${t.id}')">
          <label>${t.title}</label>
        `;
        container.appendChild(li);
      });
      document.getElementById('todo-count').innerText = `${activeCount} item${activeCount === 1 ? '' : 's'} left`;
    }

    async function toggle(id) {
      await fetch('/api/todos/' + id + '/toggle', { method: 'POST' });
      await fetchTodos();
    }

    async function clearCompleted() {
      await fetch('/api/todos/clear-completed', { method: 'POST' });
      await fetchTodos();
    }

    document.getElementById('todo-input').addEventListener('keypress', async (e) => {
      if (e.key === 'Enter') {
        const val = e.target.value.trim();
        if (val) {
          await fetch('/api/todos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: val }),
          });
          e.target.value = '';
          await fetchTodos();
        }
      }
    });

    window.addEventListener('DOMContentLoaded', fetchTodos);
  </script>
</body>
</html>
